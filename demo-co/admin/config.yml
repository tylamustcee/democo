backend:
  name: github
  repo: tylamustcee/democo
  branch: main
  base_url: https://demo.mustcee.com.au
  auth_endpoint: /.netlify/functions/auth

media_folder: "demo-co/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "hero"
        label: "Hero Section"
        file: "demo-co/_data/hero.json"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subheading", name: "subheading", widget: "string" }
          - { label: "Button Text", name: "button_text", widget: "string" }
      - name: "about"
        label: "About Section"
        file: "demo-co/_data/about.json"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Body Text", name: "body", widget: "text" }
  - name: "services"
    label: "Services"
    folder: "demo-co/_data/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Icon (emoji)", name: "icon", widget: "string" }
  - name: "products"
    label: "Shop Products"
    folder: "demo-co/_data/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name", name: "name", widget: "string" }
      - { label: "Price (AUD)", name: "price", widget: "number", value_type: "float" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "SKU", name: "sku", widget: "string" }
  - name: "gallery"
    label: "Gallery"
    folder: "demo-co/_data/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", required: false }
